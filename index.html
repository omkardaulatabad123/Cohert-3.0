<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Landing Page</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">

        <!-- Left Section -->
        <div class="left-section">

            <img src="https://upload.wikimedia.org/wikipedia/commons/9/98/International_Pok%C3%A9mon_logo.svg"
                class="logo">

            <p class="small-title">POKEMON GEN I</p>

            <h1>Pikachu</h1>

            <p class="description">
                Pikachu is an Electric-type Pokémon introduced
                in Generation I. Pikachu are small, chubby,
                and incredibly cute mouse-like Pokémon.
                They are almost completely covered by
                yellow fur.
            </p>

            <div class="count">
                <span class="line"></span>
                <span>05 / 08</span>
            </div>

            <div class="pokeball"></div>

        </div>

        <!-- Right Section -->
        <div class="right-section">

            <div class="menu">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <img src="pikk-removebg-preview.png" class="pikachu" >

            <div class="dots">
                <span class="active"></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>

    </div>

</body>
</html>
