<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squid Game Landing Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="squid.png">
</head>
<body>

    <div class="container">

        <!-- Navbar -->
        <nav class="navbar">
            <div class="logo">SQUID GAME</div>

            <ul class="nav-links">
                <li><a href="">About</a></li>
                <li><a href="">Watch now!</a></li>
                <li><a href="">Actors</a></li>
                <li><a href="">Contacts</a></li>
            </ul>

            <div class="menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>

        <!-- Hero Section -->
        <div class="hero">

            <!-- Left Content -->
            <div class="left-content">
                <h1>SQUID <br> GAME</h1>

                <p>
                    Action / Thriller / Drama Series directed by Dong-hyuk Hwang
                    <br>
                    Season 1: 9 Episodes
                </p>

                <div class="buttons">
                    <button class="play-btn">
                        <i class="fa-solid fa-play"></i> Play Now
                    </button>

                    <button class="trailer-btn">
                        Watch Trailer
                    </button>
                </div>
            </div>


            <div class="right-content">
                <img src="squid-game-logo-in-circle-removebg-preview.png" alt="squid game">
            </div>

        </div>
        <div class="cards">

            <div class="card">
                <img src="squi.png" >
            </div>

            <div class="card">
                <img src="images.jpg">
            </div>

            <div class="card">
                <img src="download (1).jpg">
            </div>

        </div>

    </div>
